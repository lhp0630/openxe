[project]
name = "openxe"
version = "0.1.0"
description = "Metadata-driven BI element extraction (DSPy): metrics, dimensions, filters"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dspy>=3.3.1",
    "fastexcel>=0.12.0",
    "polars>=1.0.0",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.9.0",
]
pydantic-ai = [
    "pydantic-ai>=1.0.0",
]
all = [
    "mcp>=1.9.0",
    "pydantic-ai>=1.0.0",
]

[project.scripts]
openxe-mcp = "openxe.mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "openpyxl>=3.1.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
